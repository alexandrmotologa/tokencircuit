<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tc-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tc-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tc-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="tc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="104" fill="url(#tc-bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#1e293b" stroke-width="3"/>

  <!-- Outer Protective Circuit Hexagon -->
  <path d="M 256 68 L 416 160 L 416 348 L 256 444 L 96 348 L 96 160 Z"
        fill="none" stroke="#1e293b" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Dynamic Circuit Tracks -->
  <path d="M 256 100 L 384 174 L 384 334 L 256 410 L 128 334 L 128 174 Z"
        fill="#0f172a" stroke="url(#tc-emerald)" stroke-width="4" stroke-linejoin="round" filter="url(#tc-glow)"/>

  <!-- Circuit Trace Nodes & Paths -->
  <!-- Top Trace (Bedrock) -->
  <path d="M 256 100 L 256 170" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="170" r="8" fill="#38bdf8"/>

  <!-- Left Trace (Anthropic) -->
  <path d="M 128 256 L 196 256" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <circle cx="196" cy="256" r="8" fill="#34d399"/>

  <!-- Right Trace (OpenAI) -->
  <path d="M 384 256 L 316 256" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="316" cy="256" r="8" fill="#fbbf24"/>

  <!-- Central Circuit Breaker Core Token Node -->
  <circle cx="256" cy="256" r="48" fill="#0b0f17" stroke="url(#tc-emerald)" stroke-width="6"/>
  <circle cx="256" cy="256" r="32" fill="url(#tc-emerald)" opacity="0.15"/>
  
  <!-- Circuit Breaker Lightning Bolt Symbol -->
  <path d="M 264 220 L 238 252 L 256 252 L 246 292 L 276 256 L 256 256 Z"
        fill="url(#tc-emerald)" filter="url(#tc-glow)"/>

  <!-- Bottom Relay Trace -->
  <path d="M 256 304 L 256 374 L 284 390" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <circle cx="284" cy="390" r="7" fill="#34d399"/>

  <!-- Small Peripheral Contact Nodes -->
  <circle cx="96" cy="160" r="6" fill="#38bdf8"/>
  <circle cx="416" cy="160" r="6" fill="#fbbf24"/>
  <circle cx="416" cy="348" r="6" fill="#34d399"/>
  <circle cx="96" cy="348" r="6" fill="#34d399"/>
  <circle cx="256" cy="444" r="6" fill="#38bdf8"/>
  <circle cx="256" cy="68" r="6" fill="#34d399"/>
</svg>
